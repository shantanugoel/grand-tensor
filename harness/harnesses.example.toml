# Grand Tensor harness config — a REFERENCE, not a starting point.
#
# YOU DO NOT NEED THIS FILE. All seven harnesses below are built into
# config.ts and work with no config at all; this file exists only to override
# them or to add an eighth. Every block is commented out on purpose — copying
# it with the blocks live would override working built-ins with worse versions
# of themselves, which is exactly how pi's model list once got broken.
#
# Copy to harnesses.toml (loaded automatically) or pass --config. Blocks merge
# over the built-in with the same id, so you only restate the field you want
# different. JSON works too.
#
# ---------------------------------------------------------------------------
# THE SEVEN BUILT-INS — type these into the "Model id" field in Settings.
#
# The field is <harness>/<model>, split on the FIRST slash, so the model may
# itself contain slashes (pi/anthropic/claude-opus-5). Listed models are
# ADVISORY: they fill the autocomplete, they do not gate what you can type, so
# a model released after this was written works without any config.
#
#   id            binary        type e.g.              reasoning effort
#   ------------- ------------- ---------------------- ------------------------
#   claude-code   claude        claude-code/opus       low/medium/high/xhigh/max
#                               claude-code/sonnet     (bare "claude-code"
#                               claude-code/haiku       means sonnet)
#   codex         codex         codex/gpt-5.6-codex    none — locks to default
#                               codex/gpt-5.6
#   gemini        gemini        gemini/gemini-3-pro    none — locks to default
#                               gemini/gemini-3-flash
#   amp           amp           amp/smart  amp/deep    none — locks to default
#                               amp/large  amp/rush    (mode IS the model here;
#                               amp/free     bare "amp" means smart)
#   pi            pi            pi/<provider>/<model>  minimal→xhigh, plus off
#                               (53 discovered live)
#   prime-agent   prime-agent   prime-agent/<model>    minimal→max, plus off
#                               (discovered live)
#   hermes        hermes        hermes/<model>         none — locks to default
#
# A "locks to default" dropdown is the CLI having exactly one setting, not a
# bug: those binaries have no effort flag to pass. A harness whose binary is
# not on PATH is marked with · at startup and simply never appears.
#
# Placeholders available in `args` and `stdin`:
#   {{system}}   the system message on its own
#   {{user}}     everything that is not the system message
#   {{messages}} system + the rest, flattened — for CLIs with no system flag
#   {{model}}    whatever followed the first slash in the model field
#   {{effort}}   the reasoning level, already mapped through effort_map
#   {{temperature}} {{maxTokens}}
#   {{outfile}}  a temp path to read the reply back from (needs outfile = true)
#
# A flag whose placeholder does not apply is dropped together with the flag in
# front of it, so `--thinking {{effort}}` disappears cleanly on "default".

# ---------------------------------------------------------------------------
# Overriding a built-in: one field, the rest inherited.
# ---------------------------------------------------------------------------
# [[harness]]
# id = "pi"
# timeout_ms = 120000

# ---------------------------------------------------------------------------
# Model discovery. Only touch this if a CLI's listing format has changed.
#
# NOTE: pi's built-in already discovers correctly. `pi --list-models` prints a
# table whose id spans two columns, so it needs models_parse = "regex" — setting
# "lines" here instead yields ids like "pi/provider" and "pi/github-copilot",
# which is exactly what an earlier version of this example did.
#
# Models are ADVISORY either way: they populate the autocomplete, they do not
# gate what you can type. `pi/some-model-released-today` works regardless.
# ---------------------------------------------------------------------------
# [[harness]]
# id = "pi"
# models_command = ["pi", "--list-models"]
# models_parse = "regex"        # "lines" | "json" | "regex"
# models_pattern = "^(\\S+)\\s+(\\S+)"
# models_replace = "$1/$2"
# models_skip = 1               # header row
# models = ["anthropic/claude-opus-5"]   # unioned with what is discovered
#
# For a harness on another machine (see the ssh section below), wrap the listing
# command the same way. Safe as a single string, unlike a prompt: no untrusted
# text is involved, so the remote shell has nothing to mangle.
# models_command = ["ssh", "-T", "-o", "BatchMode=yes", "user@hostname", "pi --list-models"]

# The rare model that does not reason, on a harness where the others do.
# [harness.model_overrides."google/gemini-3-flash"]
# efforts = []

# ---------------------------------------------------------------------------
# Turning one off without deleting it. A disabled harness disappears from
# /models and cannot be selected.
# ---------------------------------------------------------------------------
# [[harness]]
# id = "hermes"
# enabled = false

# ---------------------------------------------------------------------------
# A HARNESS ON ANOTHER MACHINE, OVER SSH.
#
# Copy the block at the bottom of this section, change user@hostname, uncomment.
# It is complete: extract, efforts and the rest inherit from the hermes built-in.
# Verified against Hermes Agent v0.20.0 — exit 0, the reply alone on stdout
# (28 bytes for a one-line answer), nothing on stderr. That clean stdout is what
# lets the inherited extract.mode = "text" work unchanged.
#
# Four things make it work, and each is easy to get wrong.
#
#  1. THE PROMPT TRAVELS ON STDIN, AND THE REMOTE SHELL LIFTS IT INTO THE
#     ARGUMENT VIA "$(cat)".
#     `ssh host a b c` joins its trailing arguments with spaces and hands the
#     result to the REMOTE shell, which re-parses it. A move prompt full of
#     newlines, quotes and {"move":"e4"} put in args would be word-split, its
#     braces eaten and its $-signs expanded. So it goes down the pipe instead,
#     which ssh forwards byte for byte, and `"$(cat)"` — double-quoted, so no
#     word splitting and no globbing — reassembles it on the far side in one
#     piece. Only short shell-safe values, like a model id, belong in args.
#
#     `hermes -z` alone will not do: it requires a prompt argument (exit 2), and
#     when given one it consumes stdin and discards it. Hence "$(cat)". The only
#     costs are the remote ARG_MAX — ~2 MB against a ~10 KB move prompt — and
#     stripped trailing newlines.
#
#  2. EVERY PLACEHOLDER SITS IN ITS OWN ARGUMENT, next to its flag.
#     A placeholder that resolves to nothing voids the whole argument it sits in,
#     and the flag before it drops as the pair — which is exactly what you want
#     from an optional -m or --provider. Folded into one string instead, as
#     "hermes -z -m {{model}}", the entire argument would vanish and take
#     `user@hostname` with it as its "flag", leaving a bare ssh login that hangs
#     until timeout_ms. ssh rejoins the pieces with spaces either way.
#
#  3. -m COMES AFTER THE PROMPT, matching the documented
#     `hermes -z "…" -m <model>`. With no model named the pair drops and what is
#     left is `hermes -z "$(cat)"` — byte for byte the command proven to work.
#
#  4. -T so no tty is allocated, BatchMode=yes so a missing key fails fast
#     instead of hanging until timeout_ms. NEVER -n: it points stdin at
#     /dev/null, which would send an empty prompt on every move.
#
# args REPLACES the built-in array wholesale — only `extract` merges field by
# field — so the remote flags are spelled out in full below.
#
# PROVIDER AND MODEL AS SEPARATE FLAGS: model_pattern.
#
# The model field is normally one value, but hermes wants `-m <name>` and
# `--provider <id>` separately. model_pattern is a regex whose NAMED GROUPS
# become placeholders: a group called `model` refines {{model}}, any other name
# is a new placeholder usable in args. Prompt placeholders (system, user,
# messages, outfile) cannot be claimed. One entry then covers every provider:
#
#   hermes/portal/deepseek-v4-flash     → -m deepseek-v4-flash --provider portal
#   hermes/openrouter/deepseek-v4-flash → -m deepseek-v4-flash --provider openrouter
#   hermes/deepseek-v4-flash            → -m deepseek-v4-flash
#   hermes                              → -m <default_model>
#
# The last two are why the prefix is written optional, `(?:…)?`: a pattern that
# does not match leaves every group empty, each flag drops with its value, and
# the plain form keeps working. Adding model_pattern cannot break an id you
# already type.
#
# Not every CLI wants this. pi's --model takes `provider/id` as ONE argument, so
# pi has no model_pattern and the whole string passes through untouched.
# ---------------------------------------------------------------------------
# [[harness]]
# id = "hermes"
# enabled = true
# command = "ssh"
# args = [
#   "-T",
#   "-o", "BatchMode=yes",
#   "-o", "ConnectTimeout=10",
#   "user@hostname",
#   "hermes -z",
#   "\"$(cat)\"",
#   "-m", "{{model}}",
#   "--provider", "{{provider}}",
# ]
# stdin = "{{messages}}"
# model_pattern = "^(?:(?<provider>[^/]+)/)?(?<model>.+)$"
# timeout_ms = 300000
#
# default_model is what makes a bare "hermes" selectable in the Model id field.
# Set it once you know an id that works; without it, a bare "hermes" sends no
# -m at all and the remote picks — which is how this was first tested.
# default_model = "portal/deepseek-v4-flash"
#
# List models WITH the provider prefix so autocomplete offers the full form.
# No models_command: `hermes model` is an INTERACTIVE picker and would hang on a
# tty-less ssh channel. These are advisory, so an unlisted id you type still works.
# models = ["portal/deepseek-v4-flash", "openrouter/deepseek-v4-flash"]
#
# Caveats, none of them fatal:
#   cwd and env apply to the LOCAL ssh process and do not cross. Put anything the
#     remote needs in the command string: "cd ~/work && FOO=1 hermes -z".
#   outfile = true cannot work remotely — {{outfile}} is a local temp path the
#     remote cannot write to. That rules ssh out for `codex` specifically.
#   On timeout the local ssh client is killed; the remote usually gets SIGHUP
#     when the channel closes, but an orphaned run is possible.

# ---------------------------------------------------------------------------
# A new harness. Needs at least id, command and args.
#
# Leave this commented unless the binary exists — an entry for a command that
# is not installed adds rows to the model list that can never answer.
# ---------------------------------------------------------------------------
# [[harness]]
# id = "my-agent"
# command = "my-agent"
# args = [
#   "--print",
#   "--model", "{{model}}",
#   "--system", "{{system}}",
#   "--reasoning", "{{effort}}",
# ]
# stdin = "{{user}}"
# cwd = "sandbox"               # relative to this file; created if missing
# timeout_ms = 300000
# default_model = "fast"
# models = ["fast", "slow"]
# efforts = ["low", "medium", "high"]
# effort_off = "none"           # what this CLI calls disabled reasoning
# env = { MY_AGENT_QUIET = "1" }
#
# How to read the reply back. mode is "text" (stdout verbatim), "json" (one
# object anywhere in stdout), or "jsonl-last" (last JSON line whose type matches
# `select`). `where` narrows further, as path → value: needed when an event type
# covers more than the reply, as pi's message_end covers the prompt too. Every
# usage path is optional and a missing one reads 0; `error` is where the harness
# explains a failure, and is reported instead of raw stdout when there is no
# reply.
#
# [harness.extract]
# mode = "jsonl-last"
# select = "final"
# where = { "message.role" = "assistant" }
# text = "message.content"
# input = "usage.input_tokens"
# output = "usage.output_tokens"
# reasoning = "usage.reasoning_tokens"
# cost = "usage.cost"
# error = "message.errorMessage"
