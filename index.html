<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The API key lives in localStorage, so an injected script could read it.
         `script-src 'self'` with no 'unsafe-inline' is the part that matters:
         it kills inline handlers and injected <script> outright. `connect-src`
         has to stay wide because the endpoint is whatever the user configures,
         localhost included for a locally hosted model. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'none';
               object-src 'none';
               form-action 'none';
               script-src 'self' https://challenges.cloudflare.com;
               style-src 'self' https://fonts.googleapis.com;
               font-src https://fonts.gstatic.com;
               img-src 'self' data:;
               frame-src https://challenges.cloudflare.com;
               connect-src 'self' https: http://localhost:* http://127.0.0.1:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060810" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Grand Tensor — the machine grandmaster circuit</title>
    <meta name="description" content="Watch two language models fight it out over 64 squares." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>♟️</text></svg>" />
  </head>
  <body>
    <div id="stage"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">▚</span>
        <span class="brand-name">GRAND TENSOR</span>
        <span class="brand-sub">the machine grandmaster circuit</span>
      </div>
      <div class="topbar-right">
        <div id="status-chip" class="chip">IDLE</div>
        <button id="btn-leaderboard" class="btn ghost" title="Standard Circuit standings"><span class="wide-only">♜ Standings</span><span class="narrow-only">♜</span></button>
        <button id="btn-fullscreen" class="btn ghost hidden" title="Fullscreen landscape">⛶</button>
        <button id="btn-settings" class="btn ghost"><span class="wide-only">⚙ Settings</span><span class="narrow-only">⚙</span></button>
      </div>
    </header>

    <!-- Street-Fighter-style vitality bars. "Health" is the side's remaining material. -->
    <section class="ko" id="ko">
      <div class="ko-side ko-p0">
        <div class="ko-head"><span class="ko-name" id="ko-name-0">Player 1</span><span class="ko-hp" id="ko-hp-0">39</span></div>
        <div class="ko-bar"><i class="ko-chip" id="ko-chip-0"></i><i class="ko-fill" id="ko-fill-0"></i></div>
        <div class="ko-stars" id="ko-stars-0"></div>
      </div>

      <div class="ko-center">
        <div class="ko-round" id="ko-round">ROUND 1</div>
        <div class="ko-score" id="ko-score">0–0</div>
        <div class="pips" id="pips"></div>
      </div>

      <div class="ko-side ko-p1">
        <div class="ko-head"><span class="ko-hp" id="ko-hp-1">39</span><span class="ko-name" id="ko-name-1">Player 2</span></div>
        <div class="ko-bar"><i class="ko-chip" id="ko-chip-1"></i><i class="ko-fill" id="ko-fill-1"></i></div>
        <div class="ko-stars" id="ko-stars-1"></div>
      </div>
    </section>

    <div id="announce" class="announce hidden"><span></span></div>

    <aside class="panel panel-left">
      <div id="player-cards"></div>

      <section class="card series-card">
        <h3>Series</h3>
        <div class="rows">
          <div class="row"><span>Move</span><b id="s-ply">0</b></div>
          <div class="row"><span>Total cost</span><b id="s-cost">$0.0000</b></div>
        </div>
      </section>

      <section class="card result-card hidden" id="result-card">
        <div id="champion" class="champion"></div>
        <div id="share" class="share">
          <button class="btn tiny" data-share="result">⧉ Result</button>
          <button class="btn tiny" data-share="link">🔗 Link</button>
          <button class="btn tiny" data-share="x">𝕏 Post</button>
          <button class="btn tiny hidden" data-share="native">↗ Share</button>
          <button id="btn-submit-leaderboard" class="btn tiny">♜ Submit</button>
        </div>
      </section>
    </aside>

    <aside class="panel panel-right" id="log-panel">
      <section class="card grow">
        <h3 id="log-toggle">Battle log<span class="log-caret"></span></h3>
        <ol id="log" class="log"></ol>
      </section>
    </aside>

    <footer class="dock">
      <button id="btn-run" class="btn primary">▶ Start series</button>
      <button id="btn-pause" class="btn" disabled>❚❚ Pause</button>
      <button id="btn-reset" class="btn ghost">↺ Reset</button>
      <label class="slider">
        <span>Turn speed</span>
        <input id="speed" type="range" min="0" max="6" step="1" value="0" />
        <b id="speed-label">Turbo</b>
      </label>
      <label class="toggle"><input id="rotate" type="checkbox" checked /> <span>Orbit</span></label>
    </footer>

    <div id="modal" class="modal hidden">
      <div class="modal-body">
        <div class="modal-head">
          <h2>Settings</h2>
          <button id="btn-close" class="btn ghost">✕</button>
        </div>
        <div id="settings-form" class="settings"></div>
        <div class="modal-foot">
          <button id="btn-defaults" class="btn ghost">Restore defaults</button>
          <button id="btn-save" class="btn primary">Save</button>
        </div>
      </div>
    </div>

    <div id="leaderboard-modal" class="modal hidden">
      <div class="modal-body leaderboard-modal-body">
        <div class="modal-head">
          <h2 id="leaderboard-title">Standard Circuit</h2>
          <button id="btn-leaderboard-close" class="btn ghost">✕</button>
        </div>
        <div id="leaderboard-content"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
